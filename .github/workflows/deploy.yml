# push to master        → staging   (afixo-web-staging: staging.afixo.io, api-staging.afixo.io)
# workflow_dispatch     → staging or production (afixo-web: afixo.io, www.afixo.io, api.afixo.io)
#
# Deploy afixo-api (same environment) before this Worker on a fresh account:
# the `API` service binding needs a target.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

# One deploy at a time per environment; never cancel a running deploy.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Cloudflare environment is fixed at build time (CLOUDFLARE_ENV); wrangler
      # refuses to deploy a build made for a different environment. The machine API
      # base URL is inlined into the client bundle for the Explorer.
      - name: Build
        run: |
          if [ "$TARGET" = "staging" ]; then
            export CLOUDFLARE_ENV=staging
            export PUBLIC_MACHINE_API_URL=https://api-staging.afixo.io
          else
            export PUBLIC_MACHINE_API_URL=https://api.afixo.io
          fi
          pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = "staging" ]; then
            pnpm wrangler deploy --env staging
          else
            pnpm wrangler deploy
          fi
